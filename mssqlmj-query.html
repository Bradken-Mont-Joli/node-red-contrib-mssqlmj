<script type="text/javascript">
    RED.nodes.registerType('mssqlmj-query', {
        category: 'storage',
        color: '#C0DEED',
        paletteLabel: "mssql",
        defaults: {
            name: { value: "" },
            serverConfig: { type: "mssqlmj-config", required: true },
            querySource: { value: "editor" },
            querySourceType: { value: "editor" },
            query: { value: "" },
            paramsSource: { value: "none" },
            paramsSourceType: { value: "none" },
            parseMustache: { value: true },
            outField: { value: "payload" },
            returnType: { value: "0" },
            throwErrors: { value: "1" },
            split: { value: false },
            rowsPerMsg: { value: 1, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: "db.svg",
        label: function() {
            return this.name || "mssql";
        },
        oneditprepare: function() {
            const node = this;

            // Configuration du champ Query Source
            const queryField = $("#node-input-querySource").typedInput({
                types: [
                    { value: 'editor', label: 'Editor', hasValue: false },
                    'msg', 'flow', 'global', 'env'
                ],
                typeField: "#node-input-querySourceType",
                default: 'editor'
            });

            // Configuration du champ Parameters Source
            const paramsField = $("#node-input-paramsSource").typedInput({
                types: [
                    { value: 'none', label: 'None', hasValue: false },
                    'msg', 'flow', 'global', 'env', 'jsonata'
                ],
                typeField: "#node-input-paramsSourceType",
                default: 'none'
            });

            // Éditeur SQL
            this.editor = RED.editor.createEditor({
                id: 'node-input-query-editor',
                mode: 'ace/mode/sql',
                value: node.query
            });

            // Affichage conditionnel de l'éditeur SQL[cite: 30]
            queryField.on('change', function() {
                const type = $(this).typedInput('type');
                if (type === 'editor') {
                    $(".node-text-editor-row").show();
                    $("#node-query-expand").show();
                } else {
                    $(".node-text-editor-row").hide();
                    $("#node-query-expand").hide();
                }
                RED.tray.resize();
            });

            // Affichage conditionnel du mode Streaming (Split)
            $("#node-input-split").on("change", function() {
                if ($(this).is(":checked")) { 
                    $(".form-row-rowsPerMsg").show(); 
                } else { 
                    $(".form-row-rowsPerMsg").hide(); 
                }
            }).trigger("change");

            // Fonctionnalité d'agrandissement de l'éditeur SQL[cite: 30]
            $('#node-query-expand').click(function(e) {
                e.preventDefault();
                const value = node.editor.getValue();
                RED.editor.editJavaScript({
                    title: 'Edit SQL Query',
                    value: value,
                    width: 'Infinity',
                    cursor: node.editor.getCursorPosition(),
                    mode: 'ace/mode/sql',
                    complete: function(v, cursor) {
                        node.editor.setValue(v, -1);
                        node.editor.gotoLine(cursor.row + 1, cursor.column, false);
                        setTimeout(function() {
                            node.editor.focus();
                        }, 300);
                    }
                });
            });
        },
        oneditsave: function() {
            $("#node-input-query").val(this.editor.getValue());
            this.editor.destroy();
            delete this.editor;
        },
        oneditcancel: function() {
            if (this.editor) { 
                this.editor.destroy(); 
                delete this.editor; 
            }
        },
        oneditresize: function (size) {
            const rows = $('#dialog-form>div:not(.node-text-editor-row)');
            let height = $('#dialog-form').height();
            for (let i = 0; i < rows.size(); i++) {
                const row = $(rows[i]);
                if (row && row.is(':hidden')) continue;
                height -= row.outerHeight(true);
            }
            const editorRow = $('#dialog-form>div.node-text-editor-row');
            height -= (parseInt(editorRow.css('marginTop')) + parseInt(editorRow.css('marginBottom')));
            const h = Math.max(height, 120);
            $('.node-text-editor').css('height', h + 'px');
            if (this.editor) this.editor.resize();
        }
    });
</script>

<style>
    .mssqlmj-form-row > label { width: 130px !important; }
    .mssqlmj-form-row > select { width: 70% !important; }
</style>

<script type="text/html" data-template-name="mssqlmj-query">
    <div class="form-row mssqlmj-form-row">
        <label for="node-input-serverConfig"><i class="fa fa-globe"></i> Connection</label>
        <input type="text" id="node-input-serverConfig">
    </div>
    <div class="form-row mssqlmj-form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Node name">
    </div>
    
    <hr>
    
    <div class="form-row mssqlmj-form-row">
        <label for="node-input-querySource"><i class="fa fa-comments"></i> Query</label>
        <input type="hidden" id="node-input-querySourceType">
        <input type="text" id="node-input-querySource" style="width: 70%;">
        <div style="float: right; position: relative; margin-top: 14px;">
            <button id="node-query-expand" class="editor-button editor-button-small" title="Expand query editor"><i class="fa fa-expand"></i></button>
        </div>
    </div>
    
    <div class="form-row mssqlmj-form-row">
        <input type="hidden" id="node-input-query">
    </div>
    
    <div class="form-row mssqlmj-form-row node-text-editor-row" style="min-height: 120px; margin-top: -6px;">
        <div style="height: 120px;" class="node-text-editor" id="node-input-query-editor"></div>
    </div>
    
    <div class="form-row mssqlmj-form-row" style="margin-top: 15px;">
        <label for="node-input-paramsSource"><i class="fa fa-list-alt"></i> Parameters</label>
        <input type="hidden" id="node-input-paramsSourceType">
        <input type="text" id="node-input-paramsSource" style="width: 70%;">
    </div>

    <div class="form-row mssqlmj-form-row">
        <label style="width:auto" for="node-input-parseMustache">
            <input type="checkbox" id="node-input-parseMustache" style="display:inline-block; width:15px; margin-bottom:0px; margin-left: 135px;">
            <span>Parse Mustache ({{msg.val}})</span>
        </label>
    </div>

    <hr>

    <div class="form-row mssqlmj-form-row">
        <label for="node-input-outField"><i class="fa fa-sign-out"></i> Output property</label>
        <span>msg.</span><input type="text" id="node-input-outField" placeholder="payload" style="width: calc(70% - 35px);">
    </div>
    
    <div class="form-row mssqlmj-form-row">
        <label for="node-input-returnType"><i class="fa fa-sign-out"></i> Output type</label>
        <select id="node-input-returnType">
            <option value="0">Original output (Rows array)</option>
            <option value="1">Driver output (Metadata + Rows)</option>
        </select>
    </div>

    <div class="form-row mssqlmj-form-row">
        <label for="node-input-throwErrors"><i class="fa fa-exclamation"></i> Error Handling</label>
        <select id="node-input-throwErrors">
            <option value="0">Send in msg.error</option>
            <option value="1">Throw error (Catch node)</option>
        </select>
    </div>

    <div class="form-row mssqlmj-form-row">
        <label style="width:auto" for="node-input-split">
            <input type="checkbox" id="node-input-split" style="display:inline-block; width:15px; margin-bottom:0px; margin-left: 135px;">
            <span>Enable Streaming (Split messages)</span>
        </label>
    </div>
    
    <div class="form-row mssqlmj-form-row form-row-rowsPerMsg" style="display:none;">
        <label for="node-input-rowsPerMsg"><i class="fa fa-cubes"></i> Rows per msg</label>
        <input type="number" id="node-input-rowsPerMsg" style="width: 100px;" min="1" placeholder="1">
    </div>
</script>

<script type="text/markdown" data-help-name="mssqlmj-query">
Executes a query against a Microsoft SQL Server database.

### Features
* **Streaming**: Enable split messages to stream large tables.
* **Mustache**: Parse `{{msg.myValue}}` directly inside the query editor.
</script>
